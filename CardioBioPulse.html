<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CardioBioPulse - Plataforma Oficial de Salud Integrativa</title>
  
  <!-- Configuración para App Web de pantalla completa nativa -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CardioBio">
  
  <!-- Tailwind CSS para el estilizado fluido -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel para compilar JSX en caliente -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans (Moderna/Médica) & Playfair Display (Elegante/Holística) -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f4f8f5; /* Verde salvia ultra claro, limpio y relajante */
      -webkit-tap-highlight-color: transparent;
    }
    .serif-title {
      font-family: 'Playfair Display', serif;
    }
    /* Ocultar barra de scroll pero mantener funcionalidad */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Degradado de Oro Pulido Real (Brillante, no café) */
    .gold-gradient {
      background: linear-gradient(135deg, #FFF3B0 0%, #D4AF37 30%, #AA7C11 70%, #FFF3B0 100%);
    }

    /* Texto de Oro Pulido Brillante con efecto máscara */
    .gold-shiny-text {
      background: linear-gradient(135deg, #FFE082 0%, #FFD54F 25%, #D4AF37 50%, #B38F00 75%, #FFE082 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      filter: drop-shadow(0px 1px 1.5px rgba(0, 0, 0, 0.15));
    }

    @keyframes goldShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .gold-shimmer-btn {
      background: linear-gradient(120deg, #D4AF37 0%, #FFF3B0 25%, #D4AF37 50%, #AA7C11 75%, #D4AF37 100%);
      background-size: 200% auto;
      animation: goldShimmer 3.5s infinite linear;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #1a1505;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
    }
    .gold-shimmer-btn:hover {
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      transform: translateY(-1px);
    }

    /* Bordes dorados finos y distinguidos */
    .gold-fine-border {
      border: 1.2px solid transparent;
      background-image: linear-gradient(#ffffff, #ffffff), linear-gradient(135deg, #FFF3B0, #D4AF37, #AA7C11);
      background-origin: border-box;
      background-clip: padding-box, border-box;
    }

    /* Badge premium de Oro Fino */
    .gold-shiny-badge {
      background-color: rgba(251, 245, 183, 0.25);
      border: 1.2px solid #D4AF37;
      color: #7a5a07;
      font-weight: 700;
    }

    /* Botón Esmeralda Premium con filete de oro fino */
    .emerald-premium-button {
      background: linear-gradient(135deg, #094a2b 0%, #157347 100%);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(9, 74, 43, 0.25);
      transition: all 0.3s ease;
      border: 1.2px solid #D4AF37;
    }
    .emerald-premium-button:hover {
      background: linear-gradient(135deg, #157347 0%, #094a2b 100%);
      box-shadow: 0 6px 18px rgba(9, 74, 43, 0.35);
      transform: translateY(-1.5px);
    }
    
    .emerald-outline-button {
      background: #ffffff;
      border: 1.5px solid #094a2b;
      color: #094a2b;
      font-weight: 700;
      transition: all 0.3s ease;
    }
    .emerald-outline-button:hover {
      background: rgba(9, 74, 43, 0.05);
    }

    /* Transición suave entre pestañas */
    .fade-enter {
      opacity: 0;
      transform: translateY(8px);
    }
    .fade-enter-active {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 300ms, transform 300ms;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-start overflow-x-hidden">

  <!-- Nodo raíz de la App React que ocupará el 100% de la pantalla táctil -->
  <div id="root" class="w-full max-w-md min-h-screen flex flex-col bg-[#fafdfb] shadow-2xl relative border-x border-[#e4ebe7]"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SPECIALISTS_DB = [
      {
        id: 1,
        name: "Dra. Eliana V. Rossini",
        title: "Especialista en Biodescodificación de Corazón & Liberación del Pericardio",
        bio: "Especializada en decodificar memorias transgeneracionales, bloqueos por abandono y heridas de traición que impactan la musculatura cardíaca y la respiración.",
        location: "Clínica Sanación Integral / Sesiones Online",
        rating: 4.9,
        reviews: 218,
        price: "$65 USD",
        image: "https://images.unsplash.com/photo-1594824813573-246434de83fb?auto=format&fit=crop&q=80&w=300",
        specialties: ["Descodificación de Corazón", "Biomagnetismo Sutil", "Liberación Emocional"]
      },
      {
        id: 2,
        name: "Lic. Mateo Altamirano",
        title: "Terapeuta en Bioenergética Avanzada & Biomagnetismo Médico",
        bio: "Dedica su consulta a la alineación y balance del polo electromagnético del corazón mediante la colocación de imanes en los pares biológicos del timo y pericardio.",
        location: "Centro Sanar-T / Sesiones Online",
        rating: 5.0,
        reviews: 142,
        price: "$55 USD",
        image: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=300",
        specialties: ["Biomagnetismo Clínico", "Alineación de Chakra Corazón", "Estrés Celular"]
      }
    ];

    const runCardioBioAnalysis = (storyText, selectedSymptom) => {
      const text = storyText.toLowerCase();
      
      let analysisResult = {
        conflictName: "Resistencia Pasiva y Armadura Emocional del Pecho",
        biodescodification: "Tu corazón físico está sano. Sin embargo, la opresión que reportas representa un 'blindaje bioenergético'. Tu cuerpo ha construido una barrera protectora alrededor del pericardio para resguardar tu vulnerabilidad ante entornos hostiles que viviste en tu juventud o niñez.",
        biomagnetism: "Cardias (Negativo) - Timo (Positivo) [Diseñado para balancear la carga energética del pecho, liberar tensiones musculares y propiciar un estado de contención y paz profunda].",
        rootInsight: "un periodo en tu pasado donde tuviste que asumir la total responsabilidad de protegerte solo/a, creando un estado de hiperalerta y tensión en el pecho que hoy en día tu cuerpo está colapsando al no haber sido expresado."
      };

      if (text.includes("papá") || text.includes("padre") || text.includes("abandono") || text.includes("abandonó") || text.includes("se fue")) {
        analysisResult = {
          conflictName: "Conflicto de Pérdida de Referente Protector (Herida de Abandono)",
          biodescodification: "El dolor o pinchazo es el eco directo de la falta de protección primaria (energía de sostén paterno). Al haber experimentado distancia o abandono, el corazón se contrae de forma refleja intentando compensar mecánicamente ese vacío emocional de seguridad.",
          biomagnetism: "Sien Derecha - Corazón (Ideal para liberar la vibración de desamparo, regular el pulso de tu sistema de conducción y promover la autoconfianza biológica del pericardio).",
          rootInsight: "la separación o frialdad de tu figura paterna durante tu infancia, grabándose en la memoria celular de tu sistema cardiovascular como un estado de alerta que colapsa con dolores de pecho en tu vida adulta."
        };
      } else if (text.includes("mamá") || text.includes("madre") || text.includes("separación") || text.includes("separó") || text.includes("nido")) {
        analysisResult = {
          conflictName: "Conflicto de Separación Afectiva del Núcleo de Cobijo",
          biodescodification: "La opresión torácica se vincula al dolor por la desconexión del núcleo de amor incondicional primario (madre). Ante una herida de separación, el pecho reduce de forma inconsciente su capacidad de expansión para evitar revivir el dolor del vacío afectivo.",
          biomagnetism: "Timo - Bazo o Cardias - Pulmón Izquierdo (Específico para reactivar la nutrición celular del afecto, suavizar el músculo cardíaco y liberar dolores opresivos).",
          rootInsight: "una etapa crítica del pasado donde percibiste una ruptura o lejanía de tu madre, obligando a tu pecho a 'congelar' esa emoción para sobrevivir, manifestándose hoy ante el estrés acumulado."
        };
      } else if (text.includes("traición") || text.includes("traicionó") || text.includes("engaño") || text.includes("pareja") || text.includes("infidelidad")) {
        analysisResult = {
          conflictName: "Cierre Defensivo por Impacto de Traición o Engaño",
          biodescodification: "Los pinchazos agudos representan el cierre hermético del pericardio (la membrana que envuelve y protege físicamente el corazón). Tras un impacto de deslealtad profunda, el pericardio se inflama y contrae para actuar como escudo ante posibles nuevas heridas afectivas.",
          biomagnetism: "Pericardio - Pericardio o Cardias - Timo (Orientado a limpiar la vibración electromagnética de decepción, relajar el sistema nervioso simpático y reabrir el chakra corazón).",
          rootInsight: "una experiencia de infidelidad, engaño o desilusión relacional profunda del pasado donde habías entregado tu absoluta confianza y terminaste construyendo una muralla celular en tu corazón."
        };
      } else if (text.includes("muerte") || text.includes("falleció") || text.includes("perdí") || text.includes("duelo") || text.includes("tristeza")) {
        analysisResult = {
          conflictName: "Cristalización Cardíaca por Duelo No Procesado",
          biodescodification: "La opresión pesada simula un peso físico en el corazón. Es la retención de la tristeza profunda y la impotencia por una pérdida. Al contener el llanto para ser fuerte, la fascia torácica se tensiona, guardando la memoria del dolor celular.",
          biomagnetism: "Parietal - Riñón Contralateral o Timo - Suprarrenales (Para reducir drásticamente el cortisol físico, facilitar la descarga de llanto retenido y liberar la energía estancada en el pecho).",
          rootInsight: "un duelo interrumpido o bloqueado de hace años que preferiste silenciar para seguir adelante, pero que quedó depositado en las cavidades energéticas de tu corazón."
        };
      } else if (selectedSymptom === 'opresion') {
        analysisResult.conflictName = "Armadura Pericárdica por Sobrecarga de Responsabilidad";
        analysisResult.biodescodification = "La opresión física es una armadura que construiste alrededor de tu caja torácica para contener la vulnerabilidad ante situaciones de presión constante. El ECG indica salud eléctrica, pero las células musculares reflejan tensión contenida.";
      } else if (selectedSymptom === 'pinchazos') {
        analysisResult.conflictName = "Descarga de Alerta en el Territorio Afectivo";
        analysisResult.biodescodification = "Los pinchazos son impulsos eléctricos del sistema simpático. Indican que tu cuerpo está reviviendo una memoria del pasado donde te sentiste bajo ataque, traicionado o sumamente expuesto en tu seguridad afectiva.";
      }

      return analysisResult;
    };

    function CardioBioPulseApp() {
      // Estado de sesión y datos personales del usuario
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userProfile, setUserProfile] = useState({
        name: '',
        age: '',
        email: '',
        cardiacHistory: 'ninguno'
      });

      // Estados de navegación y simulación
      const [activeTab, setActiveTab] = useState('ecg'); // ecg, ia, directory, profile
      const [isSensorConnected, setIsSensorConnected] = useState(false);
      const [isScanning, setIsScanning] = useState(false);
      const [ecgProgress, setEcgProgress] = useState(0);
      const [heartRate, setHeartRate] = useState(78);
      const [scanFinished, setScanFinished] = useState(false);

      // Estados de IA y desahogo
      const [symptom, setSymptom] = useState('');
      const [narrative, setNarrative] = useState('');
      const [analysis, setAnalysis] = useState(null);
      const [showIaResult, setShowIaResult] = useState(false);

      // Estados de reserva de citas
      const [selectedSpecialist, setSelectedSpecialist] = useState(null);
      const [bookingDate, setBookingDate] = useState('');
      const [bookingTime, setBookingTime] = useState('');
      const [showBookingModal, setShowBookingModal] = useState(false);
      const [isExpedienteShared, setIsExpedienteShared] = useState(true);
      const [showInstallGuide, setShowInstallGuide] = useState(false);

      // Referencias para el gráfico interactivo del ECG
      const canvasRef = useRef(null);
      const animationRef = useRef(null);

      // Historial de la cuenta (Simulación para la pantalla Perfil)
      const [userLogs, setUserLogs] = useState([]);

      useEffect(() => {
        if (activeTab !== 'ecg' || !isScanning) return;

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        const resizeCanvas = () => {
          canvas.width = canvas.parentElement.clientWidth;
          canvas.height = canvas.parentElement.clientHeight || 180;
        };
        resizeCanvas();

        let width = canvas.width;
        let height = canvas.height;
        let points = [];

        // Generador matemático de una onda de ECG Realista (P, QRS, T)
        const generateEcgWave = (time) => {
          const t = time % 1.0; 
          let base = height / 2;
          
          if (t > 0.1 && t < 0.15) { // Onda P
            return base - Math.sin((t - 0.1) * Math.PI / 0.05) * 6;
          }
          if (t >= 0.18 && t < 0.20) { // Onda Q
            return base + 5;
          }
          if (t >= 0.20 && t < 0.24) { // Complejo QRS (Impulso principal)
            const ratio = (t - 0.20) / 0.04;
            return base - 48 * Math.sin(ratio * Math.PI);
          }
          if (t >= 0.24 && t < 0.26) { // Onda S
            return base + 8;
          }
          if (t > 0.35 && t < 0.45) { // Onda T
            return base - Math.sin((t - 0.35) * Math.PI / 0.1) * 10;
          }
          return base + (Math.random() - 0.5) * 1; 
        };

        let lastTime = 0;
        let elapsed = 0;

        const drawLoop = (timestamp) => {
          if (!lastTime) lastTime = timestamp;
          const dt = (timestamp - lastTime) / 1000;
          lastTime = timestamp;
          elapsed += dt;

          ctx.fillStyle = '#fafdfb'; // Fondo verde salvia muy limpio
          ctx.fillRect(0, 0, width, height);

          // Rejilla de papel médico clínica con líneas de fondo verde sutiles
          ctx.strokeStyle = 'rgba(16, 185, 129, 0.08)';
          ctx.lineWidth = 0.8;
          for (let i = 0; i < width; i += 15) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
          }
          for (let i = 0; i < height; i += 15) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
          }

          // Dibujo de la onda del electrocardiograma en Verde Esmeralda Profundo
          ctx.strokeStyle = '#094a2b'; 
          ctx.lineWidth = 2.4;
          ctx.beginPath();

          points.push({ x: width, y: generateEcgWave(elapsed) });
          if (points.length > width / 1.5) points.shift();

          for (let i = 0; i < points.length; i++) {
            points[i].x -= 1.8;
            if (i === 0) {
              ctx.moveTo(points[i].x, points[i].y);
            } else {
              ctx.lineTo(points[i].x, points[i].y);
            }
          }
          ctx.stroke();

          animationRef.current = requestAnimationFrame(drawLoop);
        };

        animationRef.current = requestAnimationFrame(drawLoop);

        return () => {
          cancelAnimationFrame(animationRef.current);
        };
      }, [activeTab, isScanning]);

      useEffect(() => {
        if (!isScanning) return;
        setEcgProgress(0);

        const timer = setInterval(() => {
          setEcgProgress((current) => {
            if (current >= 100) {
              clearInterval(timer);
              setIsScanning(false);
              setScanFinished(true);
              return 100;
            }
            return current + 2;
          });
        }, 100);

        return () => clearInterval(timer);
      }, [isScanning]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (!userProfile.name || !userProfile.email || !userProfile.age) return;
        setIsLoggedIn(true);
        setActiveTab('ecg');
      };

      const handleAnalysis = () => {
        if (!symptom || !narrative) return;
        const res = runCardioBioAnalysis(narrative, symptom);
        setAnalysis(res);
        setShowIaResult(true);

        // Guardar automáticamente en el historial del perfil
        const newLog = {
          date: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }),
          symptom: symptom === 'opresion' ? 'Opresión en el Pecho' : 'Pinchazos / Dolor Agudo',
          conflict: res.conflictName,
          narrative: narrative.slice(0, 45) + '...'
        };
        setUserLogs([newLog, ...userLogs]);
      };

      const resetEcg = () => {
        setScanFinished(false);
        setEcgProgress(0);
        setIsScanning(false);
      };

      const confirmBooking = () => {
        setShowBookingModal(false);
        // Notificación de éxito simulada
        alert(`¡Cita agendada con éxito para el día ${bookingDate} a las ${bookingTime} con ${selectedSpecialist.name}! Se ha compartido tu historial.`);
        setActiveTab('profile');
      };

      return (
        <div className="flex-1 flex flex-col justify-between p-5 relative min-h-screen pb-24">
          
          {/* BARRA DE ESTADO MÓVIL ESTILO image_5c0244.png */}
          <div className="flex justify-between items-center text-xs text-slate-500 font-bold tracking-tight mb-2 select-none">
            <span>9:30</span>
            <div className="w-5 h-5 bg-[#094a2b] rounded-full flex items-center justify-center border border-[#D4AF37]/40 shadow-sm">
              <div className="w-1.5 h-1.5 bg-[#FFE082] rounded-full animate-pulse"></div>
            </div>
            <div className="flex items-center gap-1.5 text-[#094a2b]">
              <svg className="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.62 10.56 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
              <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </div>
          </div>

          {/* CABECERA CON MARCA CARDIOBIOPULSE EN ORO METÁLICO REAL */}
          <header className="flex justify-between items-center py-2 border-b border-[#e4ebe7] mb-4">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-[#094a2b] to-[#157347] flex items-center justify-center shadow border border-[#D4AF37]/50">
                <svg className="w-4 h-4 text-[#FFF3B0]" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                  <path d="M12 21a9 9 0 100-18 9 9 0 000 18z" strokeLinecap="round" strokeLinejoin="round" />
                  <path d="M12 7v5l3 3" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              </div>
              <div>
                <h1 className="text-sm font-black tracking-tight text-[#094a2b] uppercase">
                  Cardio<span className="gold-shiny-text">BioPulse</span>
                </h1>
                <span className="text-[8.5px] font-bold text-slate-400 block -mt-1 tracking-wider uppercase">Salud Biológica del Corazón</span>
              </div>
            </div>
            <button 
              onClick={() => setShowInstallGuide(true)}
              className="text-[9px] font-extrabold px-3 py-1.5 rounded-full bg-[#faf5d3] border border-[#D4AF37] text-[#7a5a07] hover:bg-[#ffe082]/30 transition-all uppercase tracking-wide shadow-sm"
            >
              📲 Guardar en Celular
            </button>
          </header>

          {/* SCREEN: LOGIN / CREAR PERFIL (OBLIGATORIO) */}
          {!isLoggedIn ? (
            <div className="flex-1 flex flex-col justify-between py-4 animate-fadeIn">
              <div className="space-y-5 my-auto">
                <div className="text-center space-y-2">
                  <span className="text-[10px] uppercase tracking-widest text-[#D4AF37] font-black block">Plataforma Oficial</span>
                  <h2 className="text-2xl font-bold text-[#094a2b] serif-title">Crea tu Expediente</h2>
                  <p className="text-xs text-slate-500 max-w-xs mx-auto">
                    Por favor ingresa tus datos de uso personal para calibrar la lectura del electrocardiograma y personalizar tu historial.
                  </p>
                </div>

                <form onSubmit={handleLogin} className="space-y-4 bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                  <div className="space-y-1">
                    <label className="text-[11px] font-bold text-slate-500 uppercase">Nombre Completo:</label>
                    <input 
                      type="text" 
                      required
                      value={userProfile.name}
                      onChange={(e) => setUserProfile({...userProfile, name: e.target.value})}
                      placeholder="Ej. Roberta Martínez"
                      className="w-full px-4 py-3 bg-[#f8faf8] border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-[#094a2b] focus:ring-1 focus:ring-[#094a2b] transition-all"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="text-[11px] font-bold text-slate-500 uppercase">Edad:</label>
                      <input 
                        type="number" 
                        required
                        value={userProfile.age}
                        onChange={(e) => setUserProfile({...userProfile, age: e.target.value})}
                        placeholder="Ej. 34"
                        className="w-full px-4 py-3 bg-[#f8faf8] border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-[#094a2b] focus:ring-1 focus:ring-[#094a2b] transition-all"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-[11px] font-bold text-slate-500 uppercase">Antecedentes:</label>
                      <select 
                        value={userProfile.cardiacHistory}
                        onChange={(e) => setUserProfile({...userProfile, cardiacHistory: e.target.value})}
                        className="w-full px-3 py-3 bg-[#f8faf8] border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-[#094a2b] focus:ring-1 focus:ring-[#094a2b] transition-all text-slate-600"
                      >

                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                    <path d="M4.5 10.5C3.67157 10.5 3 11.1716 3 12C3 12.8284 3.67157 13.5 4.5 13.5H7.13531C7.54585 13.5 7.91263 13.2435 8.05607 12.8556L9.62677 8.60832L11.4144 17.5463C11.5358 18.1534 12.132 18.5282 12.721 18.3686L14.394 13.9142C14.5492 13.5003 14.9458 13.2274 15.3881 13.2274H19.5" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                  <span className="text-[10px] tracking-tight">⚡ ECG</span>
                </button>

                <button 
                  onClick={() => setActiveTab('ia')}
                  className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'ia' ? 'text-[#094a2b] font-black' : 'text-slate-400'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                    <path d="M9.663 17h4.673M12 3v1m6.364.364l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                  <span className="text-[10px] tracking-tight">🧠 Consultorio IA</span>
                </button>

                <button 
                  onClick={() => setActiveTab('directory')}
                  className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'directory' ? 'text-[#094a2b] font-black' : 'text-slate-400'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                    <path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                  <span className="text-[10px] tracking-tight">🩺 Terapeutas</span>
                </button>

                <button 
                  onClick={() => setActiveTab('profile')}
                  className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'profile' ? 'text-[#094a2b] font-black' : 'text-slate-400'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2.5">
                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                  <span className="text-[10px] tracking-tight">👤 Perfil</span>
                </button>
              </nav>

            </div>
          )}

          {}
          {showBookingModal && selectedSpecialist && (
            <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-5 z-50 animate-fadeIn">
              <div className="bg-white border-2 gold-fine-border rounded-3xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
                <div className="flex items-center gap-3 bg-[#fbf9eb] p-3 rounded-2xl border border-[#D4AF37]/30">
                  <img src={selectedSpecialist.image} className="w-12 h-12 rounded-xl object-cover border" />
                  <div>
                    <h4 className="text-xs font-black text-slate-800">{selectedSpecialist.name}</h4>
                    <span className="text-[10px] text-slate-500 block leading-tight">{selectedSpecialist.title}</span>
                  </div>
                </div>

                <div className="space-y-2">
                  <label className="text-[11px] font-bold text-slate-500 uppercase block">Elige el Día:</label>
                  <div className="grid grid-cols-2 gap-2">
                    {["Lunes 8 Jun", "Martes 9 Jun"].map((d) => (
                      <button
                        key={d}
                        onClick={() => setBookingDate(d)}
                        className={`py-2.5 text-[11px] rounded-xl border font-bold transition-all text-center ${bookingDate === d ? 'border-[#094a2b] bg-[#eaf5ef] text-[#094a2b]' : 'border-slate-200 bg-white text-slate-500'}`}
                      >
                        {d}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-2">
                  <label className="text-[11px] font-bold text-slate-500 uppercase block">Elige el Horario:</label>
                  <div className="grid grid-cols-2 gap-2">
                    {["11:30 AM", "04:00 PM"].map((t) => (
                      <button
                        key={t}
                        onClick={() => setBookingTime(t)}
                        className={`py-2.5 text-[11px] rounded-xl border font-bold transition-all text-center ${bookingTime === t ? 'border-[#094a2b] bg-[#eaf5ef] text-[#094a2b]' : 'border-slate-200 bg-white text-slate-500'}`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Sincronización encriptada */}
                <div className="bg-[#fafdfb] border border-slate-100 p-3.5 rounded-xl flex items-center justify-between">
                  <div className="text-left space-y-0.5">
                    <h5 className="text-[9.5px] font-black text-[#094a2b] uppercase tracking-wider">Compartir Expediente</h5>
                    <p className="text-[8.5px] text-slate-400 leading-none">Compartir tu último ECG y reporte de desahogo de la IA.</p>
                  </div>
                  <button 
                    onClick={() => setIsExpedienteShared(!isExpedienteShared)}
                    className={`w-9 h-5 rounded-full transition-colors flex items-center p-0.5 ${isExpedienteShared ? 'bg-[#094a2b] justify-end' : 'bg-slate-300 justify-start'}`}
                  >
                    <span className="w-4 h-4 bg-white rounded-full shadow-md"></span>
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button 
                    onClick={() => setShowBookingModal(false)}
                    className="py-3 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold rounded-xl text-xs uppercase"
                  >
                    Cancelar
                  </button>
                  <button 
                    onClick={confirmBooking}
                    disabled={!bookingDate || !bookingTime}
                    className={`py-3 rounded-xl font-bold text-xs uppercase tracking-wider ${bookingDate && bookingTime ? 'gold-shimmer-btn' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                  >
                    Reservar
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {showInstallGuide && (
            <div className="fixed inset-0 bg-slate-950/85 flex items-center justify-center p-5 z-50 animate-fadeIn">
              <div className="bg-[#fafdfb] border-2 gold-fine-border rounded-3xl p-6 w-full max-w-xs space-y-4 shadow-2xl text-center">
                <span className="text-2xl block">📲</span>
                <h3 className="text-sm font-black text-[#094a2b] uppercase tracking-wider">
                  Guarda la App en tu Pantalla
                </h3>
                
                <div className="space-y-3.5 text-xs text-slate-600 text-left leading-relaxed">
                  <div className="flex gap-2.5">
                    <span className="w-5 h-5 rounded-full bg-[#eaf5ef] text-[#094a2b] flex items-center justify-center font-bold text-[10px]">1</span>
                    <p>Abre este archivo en tu navegador móvil (<strong className="text-slate-800">Safari</strong> o <strong className="text-slate-800">Chrome</strong>).</p>
                  </div>
                  <div className="flex gap-2.5">
                    <span className="w-5 h-5 rounded-full bg-[#eaf5ef] text-[#094a2b] flex items-center justify-center font-bold text-[10px]">2</span>
                    <p>Presiona el botón <strong className="text-slate-800">Compartir</strong> o los <strong className="text-slate-800">tres puntos de opciones</strong> de tu navegador.</p>
                  </div>
                  <div className="flex gap-2.5">
                    <span className="w-5 h-5 rounded-full bg-[#eaf5ef] text-[#094a2b] flex items-center justify-center font-bold text-[10px]">3</span>
                    <p>Elige la opción <strong className="text-[#094a2b] font-black">"Agregar a inicio"</strong> (o "Add to Home Screen").</p>
                  </div>
                </div>

                <p className="text-[9px] text-slate-400 leading-normal">
                  Se creará un icono real en tu teléfono y se abrirá en pantalla completa nativa sin barras de internet.
                </p>

                <button 
                  onClick={() => setShowInstallGuide(false)}
                  className="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs uppercase tracking-wider"
                >
                  Entendido y Cerrar
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<CardioBioPulseApp />, document.getElementById('root'));
  </script>
</body>
</html>
